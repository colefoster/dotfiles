"$schema" = 'https://starship.rs/config-schema.json'

format = "$directory$git_branch$git_status$cmd_duration$character"
add_newline = true

[directory]
style = "#7aa2f7"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"
repo_root_style = "bold #7aa2f7"
before_repo_root_style = "#8b94c4"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style) "

[git_branch]
style = "#bb9af7"
format = "[$branch]($style) "

[git_status]
style = "#e0af68"
format = "[$modified$staged$untracked$ahead_behind]($style)"
modified = "*"
staged = "+"
untracked = "?"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
conflicted = "!"
stashed = ""
deleted = ""
renamed = ""

[cmd_duration]
min_time = 2000
style = "dimmed white"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](#7aa2f7)"
error_symbol = "[❯](#f7768e)"
vimcmd_symbol = "[❮](#7aa2f7)"
