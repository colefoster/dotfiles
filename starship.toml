"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000
palette = 'catppuccin_mocha'

format = """
${env_var.STARSHIP_HOST_TAG}\
$directory\
$git_branch\
$git_status\
$character"""

[directory]
style = "bold lavender"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = ".../"

[git_branch]
symbol = ""
style = "bold mauve"
format = "[$branch]($style) "

[git_status]
style = "bold mauve"
format = "[$all_status$ahead_behind]($style) "

[character]
success_symbol = '[>](bold green)'
error_symbol = '[>](bold red)'
vimcmd_symbol = '[<](bold green)'

[env_var.STARSHIP_HOST_TAG]
format = "[$env_value]($style) "
style = "bold peach"
default = ""

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
