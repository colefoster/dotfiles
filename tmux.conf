# Minimal tmux config, tuned for running Claude Code inside a session.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,*256col*:RGB"

# Default 500ms swallows Esc — makes Claude Code's Esc-to-interrupt feel broken.
set -s escape-time 0

# Shift+Enter / Ctrl+Enter reach the app instead of being flattened to Enter.
set -s extended-keys on
set -as terminal-features ',*:extkeys'

# Let apps (image protocols, OSC 52 clipboard) talk straight to the terminal.
set -g allow-passthrough on
set -g set-clipboard on

set -g mouse on
set -g history-limit 100000
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1

# Rename a session in place: prefix + $
set -g renumber-windows on

# Every Claude lives in its own session and its own window, so a session ending
# means that window's work is over: detach and hand the terminal back. Falling
# back to the previous session instead hijacked a session another window was
# already showing, and made double-ctrl-C feel like it could not exit.
set -g detach-on-destroy on
