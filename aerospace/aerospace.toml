# AeroSpace — i3-style tiling for macOS.
# Super = Caps Lock, remapped by Karabiner to cmd+ctrl+alt (see karabiner/).
# Nothing in macOS uses that trio, so no binding here can collide with an app.
# Docs: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

# Launched by hand, not at login. Flip to true once you trust it.
start-at-login = false

# Everything this setup runs comes up with AeroSpace and goes down with it —
# one switch, no brew services to remember.
after-startup-command = [
  'exec-and-forget /opt/homebrew/bin/borders',
  'exec-and-forget /opt/homebrew/bin/sketchybar',
]

# Keep the default normalizations ON. They flatten containers that end up with
# a single child, which is what stops the tree quietly growing junk levels
# every time you move a window around.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'   # split along the monitor's long edge

# Follow focus with the pointer so hover-scroll and clicks land where you look
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Tell SketchyBar which workspace is live
exec-on-workspace-change = ['/bin/bash', '-c',
  '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.right      = 8
outer.bottom     = 8
# Room for SketchyBar. The built-in display already starts below the notch
# strip, so it needs less than the external one.
outer.top        = [{ monitor.'built-in' = 8 }, 40]

# Fixed-size windows fight the tiler — resize, snap back, relayout, flicker.
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = 'Info'
run = 'layout floating'

# ─────────────────────────────────────────────────────────────────────
# Super = caps = cmd-ctrl-alt
# ─────────────────────────────────────────────────────────────────────
[mode.main.binding]

# Launch
cmd-ctrl-alt-enter   = 'exec-and-forget open -na Ghostty'
cmd-ctrl-alt-shift-q = 'close'

# Focus — hjkl, the keys you drilled. Arrows are left alone so Rectangle
# (still installed, ⌃⌥-arrows) has nothing to argue with.
cmd-ctrl-alt-h = 'focus left'
cmd-ctrl-alt-j = 'focus down'
cmd-ctrl-alt-k = 'focus up'
cmd-ctrl-alt-l = 'focus right'

# Move
cmd-ctrl-alt-shift-h = 'move left'
cmd-ctrl-alt-shift-j = 'move down'
cmd-ctrl-alt-shift-k = 'move up'
cmd-ctrl-alt-shift-l = 'move right'

# Layout
cmd-ctrl-alt-slash       = 'layout tiles horizontal vertical'
cmd-ctrl-alt-comma       = 'layout accordion horizontal vertical'
cmd-ctrl-alt-f           = 'fullscreen'
cmd-ctrl-alt-shift-space = 'layout floating tiling'
cmd-ctrl-alt-shift-minus = 'resize smart -50'
cmd-ctrl-alt-shift-equal = 'resize smart +50'
cmd-ctrl-alt-shift-b     = 'balance-sizes'

# Workspaces
cmd-ctrl-alt-1 = 'workspace 1'
cmd-ctrl-alt-2 = 'workspace 2'
cmd-ctrl-alt-3 = 'workspace 3'
cmd-ctrl-alt-4 = 'workspace 4'
cmd-ctrl-alt-5 = 'workspace 5'
cmd-ctrl-alt-6 = 'workspace 6'
cmd-ctrl-alt-7 = 'workspace 7'
cmd-ctrl-alt-8 = 'workspace 8'
cmd-ctrl-alt-9 = 'workspace 9'

cmd-ctrl-alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
cmd-ctrl-alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
cmd-ctrl-alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
cmd-ctrl-alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
cmd-ctrl-alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
cmd-ctrl-alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
cmd-ctrl-alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
cmd-ctrl-alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
cmd-ctrl-alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'

cmd-ctrl-alt-tab = 'workspace-back-and-forth'

# Two displays: throw the window across, or move focus across
cmd-ctrl-alt-shift-tab = 'move-node-to-monitor --wrap-around next'
cmd-ctrl-alt-o         = 'focus-monitor --wrap-around next'

# Modes
cmd-ctrl-alt-shift-semicolon = 'mode service'

# ─────────────────────────────────────────────────────────────────────
# Service mode — one key, then back to main
# ─────────────────────────────────────────────────────────────────────
[mode.service.binding]
esc       = ['reload-config', 'mode main']
r         = ['flatten-workspace-tree', 'mode main']
f         = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

cmd-ctrl-alt-shift-h = ['join-with left', 'mode main']
cmd-ctrl-alt-shift-j = ['join-with down', 'mode main']
cmd-ctrl-alt-shift-k = ['join-with up', 'mode main']
cmd-ctrl-alt-shift-l = ['join-with right', 'mode main']
